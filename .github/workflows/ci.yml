name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  # Callable so publish.yml can gate the driver image on this suite rather
  # than duplicating it.
  workflow_call:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Coverage is measured on every leg so the command stays identical
      # across the matrix; only 3.12's reports are published, because the
      # code-health snapshot needs one deterministic source and coverage
      # differs between interpreters.
      - name: Run tests
        run: |
          pytest --tb=short -q \
            --junitxml=reports/junit.xml \
            --cov=miraasdk --cov-report=xml:reports/coverage.xml

      - name: Publish the reports the code-health lane consumes
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-py312
          path: reports/
          retention-days: 7

  # Code health, maintainability and authorship telemetry. The collector is a
  # separate package so the measurement definitions live in one place across
  # every repository rather than being copied into each one; what *this*
  # repository measures is declared in `[tool.mira_vitals]` in pyproject.toml.
  #
  # `needs: [test]` with `if: always()` on purpose: the snapshot should
  # describe the run that gated the build, including a run whose tests failed
  # -- a failing suite is a code-health observation, not a reason to record
  # nothing.
  code-health:
    name: Code health
    needs: [test]
    if: always()
    # A called reusable workflow's jobs cannot request permissions greater
    # than the calling job's, and exceeding them fails the whole run before
    # any job starts -- `startup_failure`, with no log to read. measure.yml
    # needs `actions: read` to fetch the baseline artifact from the previous
    # default-branch run and `pull-requests: read` for provenance labels, so
    # the caller has to grant them here.
    permissions:
      contents: read
      actions: read
      pull-requests: read
    # Pinned to an immutable commit, not `@main`. Two reasons, and either
    # alone would be sufficient.
    #
    # Security: `uses:` on a mutable ref executes whatever that branch holds at
    # run time, in this repository's runner, with this repository's
    # credentials -- so a change in another repository takes effect here with
    # no reviewed change here. A SHA makes every collector upgrade a commit in
    # this repo that someone approves.
    #
    # Measurement: the collector computes the function set, the percentiles and
    # the aggregates. A moving ref means two runs can execute materially
    # different code with nothing in the snapshot to explain a shift, which is
    # the silent redefinition this lane exists to prevent. `measure.yml` pins
    # the collector package for exactly this reason; leaving the workflow
    # reference itself mutable left the same hole one level up.
    #
    # This is the same commit `@main` resolved to when this PR's runs were
    # measured, so pinning changes no number here.
    uses: ieepirzy/mira-vitals/.github/workflows/measure.yml@97fe42fc57884a80689e856b84d68ea791013230
    with:
      # Installed so pyright resolves this package's own imports. Without it
      # the error count is dominated by unresolved imports and is not
      # comparable with a run that has them: measured here, that is the
      # difference between 7 errors and 1.
      project-install: "-e .[dev,driver]"
      reports-artifact: test-reports-py312
      tests-python-version: "3.12"
      # `miraasdk/` is at zero ruff findings at adoption, so the gate holds it
      # there from day one. Type errors and every complexity figure are
      # telemetry only -- see pyproject.toml for why.
      gate: true
    # Named rather than `inherit`. `inherit` forwards every secret this
    # repository holds across a repository boundary; measure.yml declares
    # exactly these two, both optional, and needs nothing else. Telemetry
    # credentials are the whole of what the collector should ever see.
    secrets:
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      CODE_HEALTH_TOKEN: ${{ secrets.CODE_HEALTH_TOKEN }}

  secret-scan:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  osv-scan:
    name: OSV vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Run OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.3.8
        with:
          scan-args: |-
            --recursive
            ./
