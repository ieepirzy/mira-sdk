[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "miraasdk"
version = "0.1.1"
description = "Client SDK for the Mira ecosystem: run-scoped OTLP telemetry (miraasdk.telemetry) and a standalone environment driver toolkit (miraasdk.driver) for Docker/Portainer/Kubernetes discovery, reporting into MiraRun's environment model."
authors = [
  { name = "ieepirzy", email = "nervy_colder_1m@icloud.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Topic :: System :: Monitoring",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.optional-dependencies]
# miraasdk.driver is intentionally not a core dependency: telemetry-only
# consumers (the overwhelmingly common case — any ordinary service just
# adding tracing) should not need to pull in an HTTP client meant for
# driving Docker sockets they'll never touch.
driver = ["httpx>=0.27"]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "httpx>=0.27"]

[project.scripts]
# The driver report loop as a process (ADR-022's node-side half). Needs the
# [driver] extra installed; without it the import fails at startup, loudly.
mira-driver = "miraasdk.driver.process:main"

[project.urls]
Homepage = "https://github.com/ieepirzy/mira-sdk"
Documentation = "https://github.com/ieepirzy/mira-sdk/blob/main/README.md"
Source = "https://github.com/ieepirzy/mira-sdk"
Issues = "https://github.com/ieepirzy/mira-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["miraasdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# ---------------------------------------------------------------------------
# Code health and provenance telemetry (mira-vitals).
#
# CI orchestrates, the repository configures, and neither holds the data
# model: `.github/workflows/ci.yml` calls the reusable workflow, and what gets
# measured in *this* repository is declared here, versioned and reviewable.
[tool.mira_vitals]
# Complexity, LOC and maintainability are measured on the shipped package
# only. Test-suite complexity is a different quantity -- a long parametrised
# test body is not a maintainability problem the way a CC-34 driver loop is --
# and mixing the two makes both series uninterpretable.
paths = ["miraasdk"]

# Lint is measured wider than that, because an unused import in a test is
# still a real finding worth trending.
lint_paths = ["miraasdk", "tests"]
# ...but only the package is gated. At the adoption commit `miraasdk/` has
# zero ruff findings under the selection below, so the gate can be switched on
# immediately and holds the package at zero; `tests/` has 2 (both F401), which
# are measured and trended rather than turned into a day-one build failure and
# the unrelated cleanup that would force.
lint_gate_paths = ["miraasdk"]
lint_blocking = true

# The ruff rule selection, declared explicitly rather than left to ruff's
# defaults. Without it `lint.total` means "whatever this version of ruff
# selects by default", which is not a stable metric: the same origo commit
# measured 12 findings under ruff 0.15.8 and 153 under 0.16.4. E1/E2/E3/E5
# (whitespace, line length) are excluded deliberately -- E501 would dominate
# the number with a signal about line width rather than code health.
lint_select = ["E4", "E7", "E9", "F", "W"]

typecheck_paths = ["miraasdk"]
# pyright over mypy: this package is a library other repositories install, so
# the errors that matter most are public-API shape errors in `X | None`
# returns and defaults, which pyright's inference surfaces more of. Recorded
# in every snapshot as `typing.tool`, because the two are not interchangeable.
type_checker = "pyright"
# Measured from the first run, gated only once the baseline reaches zero.
typecheck_blocking = false

hotspot_limit = 20

# Provenance is configuration, not code: the collector ships knowing about no
# orchestrator and no label scheme. The *schema* lives here because it is a
# property of this repository's conventions -- versioned, reviewable in a pull
# request, identical across runs. The *values* arrive as environment variables
# at run time, because only whatever launched the run knows them. Nothing is
# ever inferred from commit messages, author names or branch prefixes.
[tool.mira_vitals.provenance.labels]
"authoring:human" = "human"
"authoring:human-assisted" = "human_assisted"
"authoring:agent-supervised" = "agent_supervised"
"authoring:agent-autonomous" = "agent_autonomous"
"authoring:mixed" = "mixed"

# MiraRun is this ecosystem's agent orchestrator. It contributes nothing
# unless `MIRARUN_RUN_ID` is set: a named agent with no run to point at is an
# assertion, not a record.
[[tool.mira_vitals.provenance.agent_sources]]
name = "mirarun"
env = { run_id = "MIRARUN_RUN_ID", name = "MIRARUN_AGENT_NAME", provider = "MIRARUN_AGENT_PROVIDER", model = "MIRARUN_MODEL", authoring_mode = "MIRARUN_AUTHORING_MODE", environment_id = "MIRARUN_ENVIRONMENT_ID" }
