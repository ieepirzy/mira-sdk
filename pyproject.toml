[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "miraasdk"
version = "0.2.0"
description = "Client SDK for the Mira ecosystem: run-scoped OTLP telemetry (miraasdk.telemetry) and a standalone environment driver toolkit (miraasdk.driver) for Docker/Portainer/Kubernetes discovery, reporting into MiraRun's environment model."
authors = [
  { name = "ieepirzy", email = "nervy_colder_1m@icloud.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Topic :: System :: Monitoring",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.optional-dependencies]
# miraasdk.driver is intentionally not a core dependency: telemetry-only
# consumers (the overwhelmingly common case — any ordinary service just
# adding tracing) should not need to pull in an HTTP client meant for
# driving Docker sockets they'll never touch.
driver = ["httpx>=0.27"]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "httpx>=0.27"]

[project.scripts]
# The driver report loop as a process (ADR-022's node-side half). Needs the
# [driver] extra installed; without it the import fails at startup, loudly.
mira-driver = "miraasdk.driver.process:main"

[project.urls]
Homepage = "https://github.com/ieepirzy/mira-sdk"
Documentation = "https://github.com/ieepirzy/mira-sdk/blob/main/README.md"
Source = "https://github.com/ieepirzy/mira-sdk"
Issues = "https://github.com/ieepirzy/mira-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["miraasdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
