[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mira-sdk"
version = "0.1.0"
description = "Client SDK for agent processes in the Mira ecosystem: run-scoped telemetry export over OTLP, correlated with MiraRun/MiraGen run identity."
authors = [
  { name = "ieepirzy", email = "nervy_colder_1m@icloud.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Topic :: System :: Monitoring",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/ieepirzy/mira-sdk"
Documentation = "https://github.com/ieepirzy/mira-sdk/blob/main/README.md"
Source = "https://github.com/ieepirzy/mira-sdk"
Issues = "https://github.com/ieepirzy/mira-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["mira_sdk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
